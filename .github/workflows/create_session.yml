name: Create Telegram Session (SECURE)

on:
  workflow_dispatch:
    # Никаких inputs! Все данные берем из Secrets
    # Запускаем просто по кнопке

jobs:
  create-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyrogram tgcrypto

      - name: Create session securely
        env:
          # Берем данные ТОЛЬКО из Secrets GitHub
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ secrets.PHONE_NUMBER }}
        run: |
          python -c "
          import asyncio
          import os
          from pyrogram import Client
          
          async def main():
              # Данные из секретов, они НЕ выводятся в логи
              async with Client(
                  name='price_reposter_user',
                  api_id=int(os.environ['API_ID']),
                  api_hash=os.environ['API_HASH'],
                  phone_number=os.environ['PHONE']
              ) as client:
                  me = await client.get_me()
                  # Выводим только имя пользователя, НЕ номер и НЕ ключи
                  print(f'Session created for: {me.first_name}')
          
          asyncio.run(main())
          "

      - name: Encode session (hidden output)
        run: |
          # Кодируем, но НЕ выводим в логи
          base64 -w 0 price_reposter_user.session > session.b64
          echo "SESSION_B64=$(cat session.b64)" >> $GITHUB_ENV
          
      - name: Save to Secrets (requires GitHub API token)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Обновляем секрет USER_SESSION_BASE64
          echo "${{ env.SESSION_B64 }}" | gh secret set USER_SESSION_BASE64
          
      - name: Cleanup
        run: |
          rm -f price_reposter_user.session session.b64
