name: Create Telegram Session

on:
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub
    inputs:
      phone_number:
        description: 'Номер телефона в формате +7XXXXXXXXXX'
        required: true
        type: string
      api_id:
        description: 'API ID (число)'
        required: true
        type: string
      api_hash:
        description: 'API Hash'
        required: true
        type: string

jobs:
  create-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyrogram tgcrypto

      - name: Create session script
        run: |
          cat > create_session.py << 'EOF'
          import asyncio
          import os
          from pyrogram import Client

          async def main():
              async with Client(
                  name="price_reposter_user",
                  api_id=int(os.environ["API_ID"]),
                  api_hash=os.environ["API_HASH"],
                  phone_number=os.environ["PHONE_NUMBER"],
                  workdir="."
              ) as client:
                  print("✅ Session created!")
                  me = await client.get_me()
                  print(f"Account: {me.first_name} (@{me.username})")
          EOF

      - name: Run session creation
        env:
          API_ID: ${{ github.event.inputs.api_id }}
          API_HASH: ${{ github.event.inputs.api_hash }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
        run: |
          python create_session.py

      - name: Encode session to base64
        run: |
          if [ -f "price_reposter_user.session" ]; then
            base64 -w 0 price_reposter_user.session > session_base64.txt
            echo "SESSION_BASE64=$(cat session_base64.txt)" >> $GITHUB_ENV
            echo "✅ Session encoded successfully"
          else
            echo "❌ Session file not found!"
            exit 1
          fi

      - name: Update GitHub Secret
        uses: actions/github-script@v7
        with:
          script: |
            const { SESSION_BASE64 } = process.env;
            if (!SESSION_BASE64) {
              core.setFailed('No session base64 data found');
              return;
            }
            // Здесь нужно использовать GitHub API для обновления секрета
            console.log('Session base64 length:', SESSION_BASE64.length);
            console.log('Copy this value to USER_SESSION_BASE64 secret');
